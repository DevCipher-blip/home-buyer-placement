[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "home-buyer-placement"
version = "1.0.0"
description = "Place home buyers into neighborhoods by fit score and stated preference"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
home-buyer-placement = "home_buyer_placement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
